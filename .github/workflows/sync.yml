name: Sync to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "Kekemel"
          git config --global user.email "kekemelmohatle@gmail.com"
          git push --force https://$ {{ secrets.HF_TOKEN }}@huggingface.co/spaces/Kekemel/PAHub main
